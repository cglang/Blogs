<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CGL 技术博客 - 文件夹树导航与 Markdown 在线预览" />
  <meta name="color-scheme" content="light dark" />
  <title>blog · CGL 技术博客</title>
  <script>
    // 在样式加载前应用主题，避免闪烁
    (function () {
      try {
        var saved = localStorage.getItem("cgl-blog:theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Markdown / 代码高亮主题（light + dark，由 JS 切换 disabled） -->
  <link rel="stylesheet" href="assets/vendor/github-markdown-light.css" id="theme-md-light" />
  <link rel="stylesheet" href="assets/vendor/github-markdown-dark.css" id="theme-md-dark" disabled />
  <link rel="stylesheet" href="assets/vendor/github.min.css" id="theme-hl-light" />
  <link rel="stylesheet" href="assets/vendor/github-dark.min.css" id="theme-hl-dark" disabled />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#markdown-body">跳到正文</a>

  <!-- 内联图标库 -->
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" fill="currentColor" opacity=".85" />
    </symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24">
      <path d="M3 8V6.5A2.5 2.5 0 0 1 5.5 4H9l2 2h7.5A2.5 2.5 0 0 1 21 8.5V9H3z" fill="currentColor" opacity=".55" />
      <path d="M4.2 10h17.1a1 1 0 0 1 .97 1.24l-2.1 6A2 2 0 0 1 18.25 18H5.5A2.5 2.5 0 0 1 3 15.5V11a1 1 0 0 1 1-1z" fill="currentColor" opacity=".9" />
    </symbol>
    <symbol id="i-markdown" viewBox="0 0 16 16">
      <path fill="currentColor" d="M14.85 3c.63 0 1.15.52 1.15 1.15v7.7c0 .63-.52 1.15-1.15 1.15H1.15A1.15 1.15 0 0 1 0 11.85v-7.7C0 3.52.52 3 1.15 3h13.7ZM2 11h1.5V6.5L5.5 9 7.5 6.5V11H9V5H7.5L5.5 7.5 3.5 5H2v6Zm10.25 0 2.25-3h-1.5V5h-1.5v3h-1.5l2.25 3Z" />
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m5 13 4 4L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M15 3h6v6M10 14 21 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M16 3v4M8 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24">
      <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12V5a2 2 0 0 1 2-2h7a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      <circle cx="8" cy="8" r="1.4" fill="currentColor" />
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M10 13a5 5 0 0 0 7.07 0l2.12-2.12a5 5 0 0 0-7.07-7.07L10.7 5.22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <path d="M14 11a5 5 0 0 0-7.07 0L4.8 13.12a5 5 0 0 0 7.07 7.07l1.41-1.41" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M12 7v6M12 16.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-file" viewBox="0 0 24 24">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-layout" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.8" />
    </symbol>
    <symbol id="i-code" viewBox="0 0 24 24">
      <path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
  </svg>

  <div class="app">
    <!-- ==================== 左侧文件树 ==================== -->
    <aside class="sidebar" id="sidebar" aria-label="文件导航">
      <div class="repo-head">
        <a class="repo-link" href="#/" id="home-link" title="返回博客首页">
          <svg class="icon repo-icon"><use href="#i-book"></use></svg>
          <span class="repo-owner">cglang</span>
          <span class="repo-slash">/</span>
          <span class="repo-name">blog</span>
        </a>
        <span class="visibility-pill" title="公开博客">Public</span>
        <div class="repo-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色主题" title="切换主题">
            <svg class="icon theme-icon-light"><use href="#i-sun"></use></svg>
            <svg class="icon theme-icon-dark"><use href="#i-moon"></use></svg>
          </button>
          <button class="icon-btn" id="reload-tree" type="button" aria-label="重新加载文件树" title="重新加载文件树">
            <svg class="icon"><use href="#i-refresh"></use></svg>
          </button>
        </div>
      </div>

      <div class="tree-head">
        <div class="search-box">
          <svg class="icon search-icon"><use href="#i-search"></use></svg>
          <input
            id="tree-filter"
            type="search"
            class="search-input"
            placeholder="查找 Markdown 文件…"
            autocomplete="off"
            spellcheck="false"
            aria-label="查找文件"
          />
          <button class="search-clear" id="clear-filter" type="button" aria-label="清空搜索" hidden>
            <svg class="icon"><use href="#i-x"></use></svg>
          </button>
        </div>
        <div class="tree-summary">
          <span id="tree-summary-text">正在加载…</span>
          <span class="branch-pill" title="当前内容目录">
            <svg class="icon branch-icon"><use href="#i-folder"></use></svg>
            blog
          </span>
        </div>
      </div>

      <nav class="tree" id="tree" role="tree" aria-label="博客文件树">
        <div class="tree-skeleton" aria-hidden="true">
          <span class="sk-row" style="--w: 72%"></span>
          <span class="sk-row" style="--w: 88%; --indent: 14px"></span>
          <span class="sk-row" style="--w: 64%; --indent: 28px"></span>
          <span class="sk-row" style="--w: 78%; --indent: 28px"></span>
          <span class="sk-row" style="--w: 58%; --indent: 14px"></span>
          <span class="sk-row" style="--w: 84%"></span>
          <span class="sk-row" style="--w: 66%; --indent: 14px"></span>
        </div>
      </nav>

      <div class="sidebar-foot">
        <span id="tree-generated" title="">内容由 Markdown 驱动</span>
        <a class="foot-link" href="#/" id="about-link" title="查看博客首页">关于</a>
      </div>
    </aside>

    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="调整文件树宽度" tabindex="0"></div>

    <!-- ==================== 右侧内容区 ==================== -->
    <main class="main">
      <header class="content-head">
        <button class="icon-btn mobile-menu" id="open-sidebar" type="button" aria-label="打开文件树" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon"><use href="#i-menu"></use></svg>
        </button>

        <nav class="breadcrumb" id="breadcrumb" aria-label="文件路径">
          <span class="crumb current">blog</span>
        </nav>

        <div class="head-actions" id="head-actions" hidden>
          <button class="action-btn" id="copy-path" type="button" title="复制文件路径">
            <svg class="icon"><use href="#i-copy"></use></svg>
            <span>复制路径</span>
          </button>
          <a class="action-btn" id="raw-link" href="#" target="_blank" rel="noopener" title="在新标签页查看 Markdown 原文">
            <svg class="icon"><use href="#i-external"></use></svg>
            <span>查看原文</span>
          </a>
        </div>
      </header>

      <div class="content-scroll" id="content-scroll">
        <div class="content-wrap">
          <div class="doc-meta" id="doc-meta" hidden>
            <h1 class="doc-title" id="doc-title"></h1>
            <p class="doc-description" id="doc-description" hidden></p>
            <div class="doc-info">
              <span class="doc-info-item" id="doc-date-wrap" hidden>
                <svg class="icon"><use href="#i-calendar"></use></svg>
                <time id="doc-date"></time>
              </span>
              <span class="doc-info-dot" id="doc-dot" hidden>·</span>
              <span class="doc-info-item" id="doc-reading-wrap" hidden>
                <svg class="icon"><use href="#i-clock"></use></svg>
                <span id="doc-reading"></span>
              </span>
              <span class="doc-tags" id="doc-tags"></span>
            </div>
          </div>

          <article class="markdown-body" id="markdown-body" aria-live="polite">
            <div class="loading-state">
              <span class="spinner" aria-hidden="true"></span>
              <p>正在加载文章…</p>
            </div>
          </article>

          <footer class="doc-footer" id="doc-footer" hidden>
            <span id="doc-footer-path"></span>
            <span id="doc-footer-meta"></span>
          </footer>
        </div>
      </div>
    </main>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript-tip">此页面需要启用 JavaScript 才能加载文件树并渲染 Markdown。</div>
  </noscript>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
